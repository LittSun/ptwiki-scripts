name: Minificar e publicar AssistenteEncerramentos

on:
  push:
    branches: [main]
    paths:
      - "AssistenteEncerramentos.js"

permissions:
  contents: write

concurrency:
  group: assistente-encerramentos-publicacao
  cancel-in-progress: false

jobs:
  minificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Minificar JavaScript preservando cabeçalho e nowiki
        shell: bash
        run: |
          set -euo pipefail

          HEADER_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          MIN_FILE="$(mktemp)"

          trap 'rm -f "$HEADER_FILE" "$BODY_FILE" "$MIN_FILE"' EXIT

          awk '
            NR == 1 && $0 != "//<nowiki>" {
              print "Erro: //<nowiki> ausente." > "/dev/stderr"
              exit 1
            }
            NR == 2 && $0 != "/**" {
              print "Erro: início do cabeçalho JSDoc ausente." > "/dev/stderr"
              exit 1
            }
            NR <= 2 {
              print
              next
            }
            {
              print
              if ($0 == " */") {
                found = 1
                exit
              }
            }
            END {
              if (!found) {
                print "Erro: fechamento do cabeçalho não encontrado." > "/dev/stderr"
                exit 1
              }
            }
          ' AssistenteEncerramentos.js > "$HEADER_FILE"

          if [[ "$(tail -n 1 AssistenteEncerramentos.js)" != "//</nowiki>" ]]; then
            echo 'Erro: última linha deve ser //</nowiki>.' >&2
            exit 1
          fi

          sed '1,/^ \*\/$/d' AssistenteEncerramentos.js \
            | sed '$d' > "$BODY_FILE"

          npx --yes terser@5 "$BODY_FILE" \
            --compress \
            --mangle \
            --output "$MIN_FILE"

          cat "$HEADER_FILE" "$MIN_FILE" > AssistenteEncerramentos.min.js
          printf '\n//</nowiki>\n' >> AssistenteEncerramentos.min.js

          echo "Minificação concluída com cabeçalho e nowiki preservados."

      - name: Salvar resultado no GitHub
        id: salvar
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add AssistenteEncerramentos.min.js

          # O arquivo minificado é o gatilho da publicação na Wikipédia:
          # só há publicação se ele foi alterado nesta execução.
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no arquivo minificado. Nada será publicado."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "build: minificar AssistenteEncerramentos"

          # Integra commits que chegaram ao remoto depois do checkout
          # (push manual, execução anterior do bot) e então envia.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt/3). Tentando novamente..."
            sleep $((attempt * 3))
          done

          echo "Não foi possível enviar o commit após 3 tentativas." >&2
          exit 1

      - name: Publicar na Wikipédia
        if: steps.salvar.outputs.changed == 'true'
        shell: bash
        env:
          WIKI_USERNAME: ${{ secrets.WIKI_USERNAME }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
        run: |
          set -euo pipefail

          # Sumário = assunto do último commit que alterou o arquivo original.
          WIKI_EDIT_SUMMARY="$(git log -1 --format=%s -- AssistenteEncerramentos.js)"

          if [[ -z "${WIKI_EDIT_SUMMARY//[[:space:]]/}" ]]; then
            echo 'Erro: não foi possível obter o sumário do último commit de AssistenteEncerramentos.js.' >&2
            exit 1
          fi

          export WIKI_EDIT_SUMMARY
          node scripts/publicar-wiki.mjs
